name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:

    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    env:
      IMAGE: gabepmoreno/liatrio-api
      TAG: ${{ github.run_number }}-${{ github.run_attempt }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        
      - name: Build the Docker image
        run: docker build -t "$IMAGE:$TAG" .

      - name: Run container
        run: docker run -d --name liatrio-api -p 80:3000 "$IMAGE:$TAG"
      
      - name: run tests
        uses: liatrio/github-actions/apprentice-action@0b41561cca6822cc8d880fe0e49e7807a41fdf91

      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image
        if: github.ref == 'refs/heads/main'
        run: docker push "$IMAGE:$TAG"

      - name: Authenticate to Google Cloud
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: apprentice-exercise-liatrio
          workload_identity_provider: projects/768170358154/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-actions-deployer@apprentice-exercise-liatrio.iam.gserviceaccount.com

      - name: Deploy to Cloud Run
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: google-github-actions/deploy-cloudrun@2028e2d7d30a78c6910e0632e48dd561b064884d
        with:
          project_id: apprentice-exercise-liatrio
          service: liatrio-api
          region: us-west1
          image: docker.io/${{ env.IMAGE }}:${{ env.TAG }}
