name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:

    runs-on: ubuntu-latest

    env:
      IMAGE: gabepmoreno/liatrio-api
      TAG: ${{ github.run_number }}-${{ github.run_attempt }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Build the Docker image
        run: docker build -t "$IMAGE:$TAG" .

      - name: Run container
        run: docker run -d --name liatrio-api -p 80:3000 "$IMAGE:$TAG"
      
      - name: run tests
        uses: liatrio/github-actions/apprentice-action@0b41561cca6822cc8d880fe0e49e7807a41fdf91
