name: Docker Image CI

on:
  push:
    branches: [ "main", "feature/docker-hub-publish" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:

    runs-on: ubuntu-latest

    env:
      IMAGE: gabepmoreno/liatrio-api
      TAG: ${{ github.run_number }}-${{ github.run_attempt }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        
      - name: Build the Docker image
        run: docker build -t "$IMAGE:$TAG" .

      - name: Run container
        run: docker run -d --name liatrio-api -p 80:3000 "$IMAGE:$TAG"
      
      - name: run tests
        uses: liatrio/github-actions/apprentice-action@0b41561cca6822cc8d880fe0e49e7807a41fdf91

      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/feature/docker-hub-publish'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
